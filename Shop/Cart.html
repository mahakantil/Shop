<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Your Shopping Cart</title>
    <style>
        body {
            font-family: "Poppins", sans-serif;
            background-color: #e9ebd7;
            margin: 0;
            padding: 0;
        }

        /* Navbar for Cart Page */
        .navbar {
            width: 97%;
            background-color: #0d0d0d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 40px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar .logo { color: #f8f3f3; font-size: 24px; font-weight: 600; }
        .back-btn {
            background-color: #555;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            cursor: pointer;
            text-decoration: none;
            font-size: 16px;
        }
        .back-btn:hover { background-color: #333; }

        /* Main Cart Layout */
        .cart-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        .cart-title { width: 100%; text-align: center; margin-bottom: 30px; font-size: 28px; font-weight: 700; }
        .cart-items { flex: 2; min-width: 300px; }
        .order-summary {
            flex: 1;
            min-width: 250px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            height: fit-content;
        }

        /* Item Styling */
        .cart-item-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        .cart-item-card img { width: 80px; height: 80px; object-fit: cover; border-radius: 5px; }
        .item-details { flex-grow: 1; }
        .quantity-control { display: flex; align-items: center; gap: 10px; }
        .qty-btn {
            background-color: #eee; border: 1px solid #ccc; width: 30px; height: 30px; border-radius: 50%;
            cursor: pointer; font-size: 16px;
        }
        .item-price { font-size: 18px; font-weight: bold; color: #28a745; text-align: right; min-width: 120px; }
        .remove-item-btn { background: none; border: none; color: #dc3545; cursor: pointer; font-size: 20px; margin-left: 10px; }

        /* Summary Styling */
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 16px; }
        .summary-total { border-top: 2px solid #ccc; padding-top: 15px; margin-top: 15px; font-size: 20px; font-weight: bold; }
        .checkout-btn {
            width: 100%; padding: 15px; background-color: #28a745; color: white; border: none; border-radius: 8px;
            font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px;
        }
        .empty-cart-message {
            text-align: center; font-size: 20px; color: #555; padding: 50px; background: white; border-radius: 10px;
        }

        @media (max-width: 768px) {
            .cart-container { flex-direction: column; margin: 20px; }
            .cart-item-card { flex-wrap: wrap; justify-content: space-between; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">👟 Your Cart</div>
        <a href="Shop-Item.html" class="back-btn">← Continue Shopping</a>
    </nav>

    <div class="cart-container">
        <h2 class="cart-title">🛒 Your Shopping Cart</h2>

        <div class="cart-items" id="cartItemsContainer">
            <div class="empty-cart-message" id="emptyCartMessage" style="display: none;">
                Your cart is empty! Start adding some cool sneakers!
            </div>
        </div>

        <div class="order-summary">
            <h3>Order Summary</h3>
            <div id="summaryDetails"></div>
            
            <div class="payment-mode">
                <h4>Payment Mode</h4>
                <p>Options like Credit Card, UPI, and Cash on Delivery will be implemented here.</p>
            </div>
            
            <button class="checkout-btn" onclick="alert('Proceeding to Payment - This is a demo checkout!')">
                Proceed to Payment
            </button>
        </div>
    </div>

    <script>
        // MUST match the product list in Shop-Item.html
        const allProducts = [
            { id: 1, name: "Nike Air Zoom", price: 30000, img: "Jordan Chicago Jordan Red Jordan Pink Jordan.jpg" },
            { id: 2, name: "Adidas Ultraboost", price: 15000, img: "download (1).jpg" },
            { id: 3, name: "Puma RS-X", price: 6000, img: "Puma OG Speedcat.jpg" },
            { id: 4, name: "Onituska Tiger Classic", price: 4000, img: "onitsuka.jpg" }
        ];

        let cart = {};
        const SHIPPING_FEE = 500;
        const cartItemsContainer = document.getElementById('cartItemsContainer');
        const summaryDetails = document.getElementById('summaryDetails');
        const emptyCartMessage = document.getElementById('emptyCartMessage');
        

        function loadCart() {
            const storedCart = localStorage.getItem('shoppingCart');
            if (storedCart) { cart = JSON.parse(storedCart); }
        }

        function saveCart() {
            localStorage.setItem('shoppingCart', JSON.stringify(cart));
            renderCart(); // Re-render immediately after changing the cart
        }

        function formatPrice(price) {
            return `Rs ${price.toLocaleString('en-IN')}`;
        }

        function renderCartItems() {
            cartItemsContainer.innerHTML = '';
            let hasItems = false;

            for (const productId in cart) {
                const quantity = cart[productId];
                
                if (quantity > 0) {
                    hasItems = true;
                    const product = allProducts.find(p => p.id == productId);
                    if (!product) continue;

                    const itemTotal = product.price * quantity;

                    const itemCard = document.createElement('div');
                    itemCard.classList.add('cart-item-card');
                    itemCard.innerHTML = `
                        <img src="${product.img}" alt="${product.name}">
                        <div class="item-details">
                            <h4>${product.name}</h4>
                            <p>Unit Price: ${formatPrice(product.price)}</p>
                            <div class="quantity-control">
                                <button class="qty-btn" data-id="${productId}" data-action="decrement">-</button>
                                <span>${quantity}</span>
                                <button class="qty-btn" data-id="${productId}" data-action="increment">+</button>
                            </div>
                        </div>
                        <div class="item-price">${formatPrice(itemTotal)}</div>
                        <button class="remove-item-btn" data-id="${productId}" data-action="remove_all">
                            &times;
                        </button>
                    `;
                    cartItemsContainer.appendChild(itemCard);
                }
            }
            
            emptyCartMessage.style.display = hasItems ? 'none' : 'block';
            if (!hasItems) {
                cartItemsContainer.appendChild(emptyCartMessage);
            }
        }

        function renderOrderSummary() {
            let subtotal = 0;
            let totalItems = 0;

            for (const productId in cart) {
                const quantity = cart[productId];
                if (quantity > 0) {
                    const product = allProducts.find(p => p.id == productId);
                    if (product) {
                        subtotal += product.price * quantity;
                        totalItems += quantity;
                    }
                }
            }
            
            const shipping = subtotal > 0 ? SHIPPING_FEE : 0;
            const orderTotal = subtotal + shipping;

            summaryDetails.innerHTML = `
                <div class="summary-row">
                    <span>Subtotal (${totalItems} items)</span>
                    <span>${formatPrice(subtotal)}</span>
                </div>
                <div class="summary-row">
                    <span>Shipping & Handling</span>
                    <span>${shipping === 0 ? 'FREE' : formatPrice(shipping)}</span>
                </div>
                <div class="summary-total summary-row">
                    <span>Order Total:</span>
                    <span style="color: #007bff;">${formatPrice(orderTotal)}</span>
                </div>
            `;
        }

        function renderCart() {
            renderCartItems();
            renderOrderSummary();
        }

        // Event handler for quantity changes
        document.addEventListener('click', (e) => {
            const productId = e.target.getAttribute('data-id');
            const action = e.target.getAttribute('data-action');

            if (!productId || !action) return;

            const id = parseInt(productId);
            
            if (action === 'increment') {
                cart[id] = (cart[id] || 0) + 1;
            } else if (action === 'decrement') {
                if (cart[id] && cart[id] > 0) {
                    cart[id]--;
                    if (cart[id] === 0) delete cart[id];
                }
            } else if (action === 'remove_all') {
                delete cart[id];
            }
            
            saveCart();
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadCart();
            renderCart();
        });
    </script>
</body>
